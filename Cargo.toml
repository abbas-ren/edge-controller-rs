[package]
name = "edgecontroller"
version = "0.1.0"
edition = "2021"
authors = ["abbas-ren"]

[dependencies]

# Keep edition 2021 until fields named `gen` are renamed.
# `gen` is reserved in Rust 2024.

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
nix = { version = "0.31.3" }
tokio = { version = "1.53.1", features = ["full"] }

# "rt" is needed for TaskTracker; "io" for ReaderStream.
tokio-util = { version = "0.7.19", features = ["rt", "io"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
futures = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
] }
sysinfo = "0.39.6"
serialport = "4.10.1"
rusb = "0.9.4"
gpio-cdev = "0.6.0"
tempfile = "3.27.0"
if-addrs = "0.15.0"
chrono = "0.4.45"
walkdir = "2.5.0"
